<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Haushalt+">
    <meta name="theme-color" content="#92400e">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <title>Kalender – Haushalt+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/de.global.min.js"></script>
    <style>
        .fc { font-family: inherit; }
        .fc-toolbar-title { font-size: 1rem !important; font-weight: 700; color: #1c1917; }
        .fc-button-primary {
            background-color: #92400e !important;
            border-color: #92400e !important;
            border-radius: 0.75rem !important;
            padding: 0.25rem 0.75rem !important;
            font-size: 0.875rem !important;
            box-shadow: none !important;
        }
        .fc-button-primary:hover { background-color: #78350f !important; border-color: #78350f !important; }
        .fc-button-primary:focus { box-shadow: none !important; outline: none !important; }
        .fc-daygrid-day-number { color: #44403c; font-size: 0.8rem; padding: 4px 6px !important; }
        .fc-day-today .fc-daygrid-day-number {
            background-color: #92400e;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
        }
        .fc-day-today { background: transparent !important; }
        .fc-col-header-cell-cushion { color: #78716c; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .fc-event {
            border: none !important;
            border-radius: 4px !important;
            padding: 1px 5px !important;
            font-size: 0.7rem !important;
            cursor: pointer;
            line-height: 1.4;
        }
        .fc-theme-standard td, .fc-theme-standard th { border-color: #f5f5f4; }
        .fc-scrollgrid { border: none !important; }
        .fc-scrollgrid td:last-child { border-right: none !important; }
        .fc-scrollgrid-section > td { border: none !important; }
        .fc-daygrid-day.fc-day-other .fc-daygrid-day-number { color: #d6d3d1; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen pb-24">

    <!-- Header -->
    <div class="bg-amber-800 text-white px-5 pt-8 pb-4">
        <h1 class="text-xl font-semibold text-amber-200">Haushalt+</h1>
        <p class="text-3xl font-bold tracking-tight mt-1">Kalender</p>
    </div>

    <!-- Filter -->
    <div class="px-4 pt-4 max-w-lg mx-auto">
        <div class="flex gap-2">
            <button id="btn-all" onclick="setFilter('all')"
                class="flex-1 py-2 rounded-xl text-sm font-semibold transition bg-stone-800 text-white">
                Beide
            </button>
            <button id="btn-max" onclick="setFilter('max')"
                class="flex-1 py-2 rounded-xl text-sm font-semibold transition bg-indigo-100 text-indigo-600">
                Max
            </button>
            <button id="btn-kaya" onclick="setFilter('kaya')"
                class="flex-1 py-2 rounded-xl text-sm font-semibold transition bg-pink-100 text-pink-500">
                Kaya
            </button>
        </div>
    </div>

    <!-- Calendar -->
    <div class="px-4 pt-3 max-w-lg mx-auto">
        <div class="bg-white rounded-2xl p-3 shadow-sm">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Legend -->
    <div class="px-4 pt-3 max-w-lg mx-auto flex gap-4">
        <div class="flex items-center gap-1.5 text-xs text-stone-500">
            <span class="w-3 h-3 rounded-full inline-block" style="background:#6366f1"></span> Max
        </div>
        <div class="flex items-center gap-1.5 text-xs text-stone-500">
            <span class="w-3 h-3 rounded-full inline-block" style="background:#ec4899"></span> Kaya
        </div>
        <p class="text-xs text-stone-400 ml-auto">Auf Tag tippen zum Hinzufügen</p>
    </div>

    <!-- Modal (bottom sheet) -->
    <div id="modal" class="fixed inset-0 bg-black/40 z-50 items-end justify-center" style="display:none;">
        <div class="bg-white rounded-t-3xl w-full max-w-lg p-6 pb-10 shadow-2xl">
            <h2 id="modal-title" class="text-lg font-bold text-stone-800 mb-5">Termin hinzufügen</h2>

            <!-- Person -->
            <div class="flex gap-2 mb-4">
                <button id="btn-person-max" onclick="selectPerson('max')"
                    class="flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition bg-indigo-100 text-indigo-700 border-indigo-400">
                    Max
                </button>
                <button id="btn-person-kaya" onclick="selectPerson('kaya')"
                    class="flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition bg-stone-50 text-stone-400 border-transparent">
                    Kaya
                </button>
            </div>

            <!-- Title -->
            <input id="event-title" type="text" placeholder="Titel (z.B. Arzttermin)"
                class="w-full border border-stone-200 rounded-xl px-4 py-3 text-stone-800 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-amber-600">

            <!-- Date & Time -->
            <div class="flex gap-2 mb-3">
                <input id="event-date" type="date"
                    class="flex-1 border border-stone-200 rounded-xl px-3 py-3 text-stone-800 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600">
                <input id="event-time" type="time" disabled
                    class="w-28 border border-stone-200 rounded-xl px-3 py-3 text-stone-800 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 disabled:bg-stone-50 disabled:text-stone-300 disabled:cursor-not-allowed">
            </div>

            <!-- All Day -->
            <label class="flex items-center gap-2 text-sm text-stone-600 mb-5 cursor-pointer select-none">
                <input id="event-allday" type="checkbox" checked onchange="toggleAllDay(this.checked)"
                    class="w-4 h-4 accent-amber-700">
                Ganztägig
            </label>

            <!-- Actions -->
            <div class="flex gap-2">
                <button onclick="closeModal()"
                    class="flex-1 py-3 rounded-xl bg-stone-100 text-stone-600 text-sm font-semibold">
                    Abbrechen
                </button>
                <button id="btn-delete" onclick="deleteEvent()"
                    class="px-4 py-3 rounded-xl bg-red-50 text-red-500 text-sm font-semibold" style="display:none;">
                    Löschen
                </button>
                <button onclick="saveEvent()"
                    class="flex-1 py-3 rounded-xl bg-amber-800 text-white text-sm font-semibold">
                    Speichern
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-stone-900 flex justify-around items-center py-3 z-40">
        <a href="/" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10"/>
            </svg>
            <span class="text-xs">Start</span>
        </a>
        <a href="/grocery" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span class="text-xs">Einkaufen</span>
        </a>
        <a href="/mealplan" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-xs">Wochenplan</span>
        </a>
        <a href="/recipes" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <span class="text-xs">Rezepte</span>
        </a>
        <a href="/kalender" class="flex flex-col items-center gap-0.5 text-amber-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-xs">Kalender</span>
        </a>
    </nav>

    <script>
        const COLORS = { max: '#6366f1', kaya: '#ec4899' };
        let currentFilter = 'all';
        let editingId = null;
        let selectedPerson = 'max';
        let calendar;

        document.addEventListener('DOMContentLoaded', () => {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                locale: 'de',
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev', center: 'title', right: 'next' },
                height: 'auto',
                fixedWeekCount: false,
                events(info, ok, fail) {
                    fetch('/kalender/events')
                        .then(r => r.json())
                        .then(evs => {
                            if (currentFilter !== 'all') evs = evs.filter(e => e.resourceId === currentFilter);
                            ok(evs);
                        })
                        .catch(fail);
                },
                dateClick(info) { openAdd(info.dateStr); },
                eventClick(info) { openEdit(info.event); }
            });
            calendar.render();
        });

        function setFilter(f) {
            currentFilter = f;
            document.getElementById('btn-all').className = 'flex-1 py-2 rounded-xl text-sm font-semibold transition ' +
                (f === 'all' ? 'bg-stone-800 text-white' : 'bg-stone-100 text-stone-500');
            document.getElementById('btn-max').className = 'flex-1 py-2 rounded-xl text-sm font-semibold transition ' +
                (f === 'max' ? 'bg-indigo-500 text-white' : 'bg-indigo-100 text-indigo-600');
            document.getElementById('btn-kaya').className = 'flex-1 py-2 rounded-xl text-sm font-semibold transition ' +
                (f === 'kaya' ? 'bg-pink-500 text-white' : 'bg-pink-100 text-pink-500');
            calendar.refetchEvents();
        }

        function openAdd(dateStr) {
            editingId = null;
            document.getElementById('modal-title').textContent = 'Termin hinzufügen';
            document.getElementById('event-title').value = '';
            document.getElementById('event-date').value = dateStr;
            document.getElementById('event-time').value = '';
            document.getElementById('event-allday').checked = true;
            document.getElementById('event-time').disabled = true;
            document.getElementById('btn-delete').style.display = 'none';
            selectPerson('max');
            showModal();
        }

        function openEdit(event) {
            editingId = event.id;
            document.getElementById('modal-title').textContent = 'Termin bearbeiten';
            document.getElementById('event-title').value = event.title;
            document.getElementById('event-date').value = event.startStr.split('T')[0];
            const allDay = event.allDay;
            document.getElementById('event-allday').checked = allDay;
            if (!allDay && event.startStr.includes('T')) {
                document.getElementById('event-time').value = event.startStr.split('T')[1].substring(0, 5);
                document.getElementById('event-time').disabled = false;
            } else {
                document.getElementById('event-time').value = '';
                document.getElementById('event-time').disabled = true;
            }
            selectPerson(event.extendedProps.resourceId || 'max');
            document.getElementById('btn-delete').style.display = 'block';
            showModal();
        }

        function selectPerson(p) {
            selectedPerson = p;
            document.getElementById('btn-person-max').className =
                'flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition ' +
                (p === 'max' ? 'bg-indigo-100 text-indigo-700 border-indigo-400' : 'bg-stone-50 text-stone-400 border-transparent');
            document.getElementById('btn-person-kaya').className =
                'flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition ' +
                (p === 'kaya' ? 'bg-pink-100 text-pink-600 border-pink-400' : 'bg-stone-50 text-stone-400 border-transparent');
        }

        function toggleAllDay(checked) {
            document.getElementById('event-time').disabled = checked;
            if (checked) document.getElementById('event-time').value = '';
        }

        function showModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function saveEvent() {
            const title = document.getElementById('event-title').value.trim();
            const date = document.getElementById('event-date').value;
            const time = document.getElementById('event-time').value;
            const allDay = document.getElementById('event-allday').checked;
            if (!title || !date) return;

            const payload = {
                title,
                start: allDay ? date : `${date}T${time || '00:00'}`,
                allDay,
                resourceId: selectedPerson,
                color: COLORS[selectedPerson]
            };

            await fetch(editingId ? `/kalender/events/${editingId}/edit` : '/kalender/events/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            closeModal();
            calendar.refetchEvents();
        }

        async function deleteEvent() {
            if (!editingId) return;
            await fetch(`/kalender/events/${editingId}/delete`, { method: 'POST' });
            closeModal();
            calendar.refetchEvents();
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
    </script>
</body>
</html>

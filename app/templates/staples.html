<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standardartikel – Haushalt+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease both; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen pb-24">

    <!-- Header -->
    <div class="bg-amber-800 text-white px-5 pt-8 pb-6">
        <a href="/grocery" class="text-amber-300 text-sm">← Einkaufsliste</a>
        <p class="text-3xl font-bold mt-1">Standardartikel</p>
        <p class="text-amber-300 text-sm mt-1">Tippen zum Einkaufen hinzufügen</p>
    </div>

    <div class="px-4 pt-4 max-w-lg mx-auto">

        <!-- Hinzufügen -->
        <form action="/staples" method="post" class="flex gap-2 mb-4 fade-in">
            <input
                type="text"
                name="name"
                placeholder="Artikel hinzufügen…"
                required
                autocomplete="off"
                class="flex-1 px-4 py-3 rounded-xl border border-stone-200 bg-white text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-600 text-base"
            >
            <button type="submit"
                    class="bg-amber-800 text-white px-5 py-3 rounded-xl font-bold text-xl active:scale-95 transition-transform">+</button>
        </form>

        <!-- Liste -->
        {% if items %}
        <ul class="space-y-2 fade-in">
            {% for item in items %}
            <li class="bg-white rounded-xl px-4 py-3 shadow-sm flex items-center justify-between gap-3">
                <button onclick="addToGrocery({{ item.id }}, this)"
                        class="flex-1 text-left text-stone-700 text-sm font-medium active:scale-95 transition-transform">
                    {{ item.name }}
                </button>
                <button onclick="deleteStaple({{ item.id }}, this)"
                        class="text-stone-300 hover:text-red-400 transition-colors p-1 flex-shrink-0"
                        aria-label="Löschen">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="text-center py-16 text-stone-400 fade-in">
            <p class="text-4xl mb-3">📋</p>
            <p class="font-medium">Noch keine Standardartikel</p>
            <p class="text-sm mt-1">Füge Artikel hinzu, die du regelmäßig brauchst.</p>
        </div>
        {% endif %}
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg z-50">
        ✓ <span id="toast-msg"></span>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-stone-900 flex justify-around items-center py-3 z-50">
        <a href="/" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10"/>
            </svg>
            <span class="text-xs">Start</span>
        </a>
        <a href="/grocery" class="flex flex-col items-center gap-0.5 text-amber-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span class="text-xs">Einkaufen</span>
        </a>
        <a href="/mealplan" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-xs">Wochenplan</span>
        </a>
        <a href="/recipes" class="flex flex-col items-center gap-0.5 text-stone-400">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <span class="text-xs">Rezepte</span>
        </a>
    </nav>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function addToGrocery(id, btn) {
            btn.disabled = true;
            btn.classList.add('text-amber-600');
            fetch(`/staples/${id}/add_to_grocery`, { method: 'POST' })
                .then(() => {
                    showToast(`${btn.textContent.trim()} hinzugefügt`);
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.remove('text-amber-600');
                    }, 1500);
                });
        }

        function deleteStaple(id, btn) {
            const li = btn.closest('li');
            li.style.opacity = '0';
            li.style.transition = 'opacity 0.2s';
            fetch(`/staples/delete/${id}`, { method: 'POST' })
                .then(() => li.remove());
        }
    </script>
</body>
</html>
